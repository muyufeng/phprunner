; ============================================================
; phprunner php.ini 主模板（三形态共用，双二进制同读一份）
; 文档：docs/project-structure.md §1（control/etc/php/）
;       docs/static-php-runtime-discussion.md §6 #3（动态 ini 机制）
;
; 机制（M2-08 实证）：${PHP_XXX} 为 PHP 原生解析期 ENV 展开——
;   出厂默认来自镜像 Dockerfile ENV 块（默认值双层制），用户
;   -e / compose environment 覆写即生效，零文本渲染（§8 机制①）。
;   conf.d 分片经镜像 ENV PHP_INI_SCAN_DIR=/etc/php/conf.d 启用。
;   双二进制编译期统一 --with-config-file-path=/etc/php（M1 收口）。
;
; 模板立场：精简模板，不照抄 serversideup 全量 ~1900 行 production
;   ini——静态二进制自带编译默认，本文件只承载 ① ENV 旋钮
;   ② 生产加固差异项，跨 PHP 版本零同步负担。
;
; ENV 接口（四层命名空间之 PHP_* 层，2026-08-16 拍板）：变量表
;   与默认值以各镜像 Dockerfile ENV 块为事实源同源维护（§8 教训：
;   文档另抄一份必漂移——serversideup 实证 PHP_SESSION_COOKIE_SECURE
;   文档 1 / 代码 false）。
; 👤 用户必读：本文件位于自定义路径 /etc/php（非官方镜像惯例的
;   /usr/local/etc/php 或 /etc/frankenphp）——定制方法（ENV 覆写 /
;   conf.d 分片 / 整份替换）见仓库 README「php.ini 位置」节。
; ============================================================

[PHP]
; --- 资源限制 ---
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = ${PHP_MAX_INPUT_TIME}
max_input_vars = ${PHP_MAX_INPUT_VARS}

; --- 上传（成对配比：post_max_size 需 ≥ upload_max_filesize）---
post_max_size = ${PHP_POST_MAX_SIZE}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILE_SIZE}

; --- 路径（open_basedir 空 = 不限制；realpath 缓存对大代码树有感）---
open_basedir = ${PHP_OPEN_BASEDIR}
realpath_cache_ttl = ${PHP_REALPATH_CACHE_TTL}

; --- 错误处理（生产默认；LOG_OUTPUT_LEVEL=debug 时由 conf.d/zzz-debug.ini 翻转）---
; log_errors 必须显式 On：编译默认 Off 会使 error_log 失效，
; 生产 display_errors=Off 下日志是唯一错误出口（对齐 serversideup/php.ini-production）
log_errors = On
display_errors = ${PHP_DISPLAY_ERRORS}
display_startup_errors = ${PHP_DISPLAY_STARTUP_ERRORS}
error_reporting = ${PHP_ERROR_REPORTING}
error_log = ${PHP_ERROR_LOG}

; --- 生产加固差异项（非 ENV 旋钮，与编译默认的差异显式化）---
expose_php = Off
zend.assertions = -1
; 异常消息默认截断 15 字符的参数值，可能泄漏敏感串进日志；置 0 对齐 production 模板
zend.exception_string_param_max_len = 0
; 编译默认 EGPCS 会把容器 ENV（含密钥）注入 $_ENV/$_REQUEST；裁剪为 GPCS
variables_order = GPCS

[Date]
date.timezone = ${PHP_DATE_TIMEZONE}

[Session]
; SSL_MODE ≠ off 的部署建议设 1（应用契约，M4 compose 样例层提示）
session.cookie_secure = ${PHP_SESSION_COOKIE_SECURE}

[opcache]
; 双指令同源同开关（cli 长驻进程 queue/scheduler 与 web 一致对待）
opcache.enable = ${PHP_OPCACHE_ENABLE}
opcache.enable_cli = ${PHP_OPCACHE_ENABLE}
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION}
opcache.interned_strings_buffer = ${PHP_OPCACHE_INTERNED_STRINGS_BUFFER}
opcache.max_accelerated_files = ${PHP_OPCACHE_MAX_ACCELERATED_FILES}
; validate_timestamps=0 = 放弃热更（镜像不可变部署推荐姿势，代码变更即重启）
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ}
opcache.save_comments = ${PHP_OPCACHE_SAVE_COMMENTS}
opcache.enable_file_override = ${PHP_OPCACHE_ENABLE_FILE_OVERRIDE}
; JIT 成对配比：jit_buffer_size=0 时 jit 档位无实际效果
opcache.jit = ${PHP_OPCACHE_JIT}
opcache.jit_buffer_size = ${PHP_OPCACHE_JIT_BUFFER_SIZE}
; M2-03 陷阱固化：默认 2s 内新写入文件只记 miss 不缓存；
; 镜像部署语义（原子替换/重建容器）下无半写文件风险，置 0 免陷阱
opcache.file_update_protection = 0
